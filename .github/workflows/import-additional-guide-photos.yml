name: Import additional guide photos

on:
  push:
    branches: [fix/guide-image-cropping-alt-and-legal-photo]
    paths:
      - scripts/import-additional-guide-photos.py

permissions:
  contents: write

jobs:
  download-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the guide image fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/guide-image-cropping-alt-and-legal-photo
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image processing dependency
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Download and optimise additional guide photos
        run: python scripts/import-additional-guide-photos.py

      - name: Commit images to the same branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/images/guides/blackjack-casino.webp static/images/guides/live-casino.webp static/images/guides/privacy-documents.webp
          git commit -m "Add blackjack, live casino and legal guide photos"
          git push origin HEAD:fix/guide-image-cropping-alt-and-legal-photo
