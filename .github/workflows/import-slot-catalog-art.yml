name: Import artwork for expanded slot catalogue

on:
  push:
    branches: [content/expand-slot-catalog-30-games]
    paths:
      - scripts/import-slot-catalog-art.py

permissions:
  contents: write

jobs:
  download-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the expanded slot catalogue branch
        uses: actions/checkout@v4
        with:
          ref: content/expand-slot-catalog-30-games
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image processing dependency
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Download and prepare game artwork
        run: python scripts/import-slot-catalog-art.py

      - name: Commit optimised game artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/images/slots/catalog-*.webp
          git commit -m "Add artwork for 21 more slot games"
          git push origin HEAD:content/expand-slot-catalog-30-games
