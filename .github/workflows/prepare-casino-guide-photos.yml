name: Prepare casino guide photos

on:
  push:
    branches: [design/casino-guide-photos]
    paths:
      - scripts/download-guide-photos.py

permissions:
  contents: write

jobs:
  download-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the photo update branch
        uses: actions/checkout@v4
        with:
          ref: design/casino-guide-photos
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image processing dependency
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Download and optimise Pexels photos
        run: python scripts/download-guide-photos.py

      - name: Commit downloaded WebP images to the same branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/images/guides/*.webp
          if git diff --cached --quiet; then
            echo "No image changes to commit."
            exit 0
          fi
          git commit -m "Add casino photography for guide cards"
          git push origin HEAD:design/casino-guide-photos
