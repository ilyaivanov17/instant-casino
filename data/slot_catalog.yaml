      en: An ancient-Egypt adventure with scatter symbols, free spins and expanding symbols.
      pl: Przygoda w scenerii starożytnego Egiptu z symbolami Scatter, darmowymi spinami i rozszerzającymi się symbolami.
      es: Una aventura ambientada en el antiguo Egipto con símbolos scatter, giros gratis y símbolos expansivos.
      pt: Uma aventura no antigo Egito com símbolos scatter, rodadas grátis e símbolos expansíveis.
      ja: 古代エジプトを舞台に、Scatterシンボル、フリースピン、拡張シンボルが登場する冒険テーマです。
    alt:
