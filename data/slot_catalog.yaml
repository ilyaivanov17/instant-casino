      en: Book of Dead game artwork showing an explorer and a mysterious book in an ancient Egyptian setting
      pl: Grafika Book of Dead przedstawiająca poszukiwacza przygód i tajemniczą księgę na tle starożytnego Egiptu
      es: Arte de Book of Dead con un explorador y un libro misterioso en un entorno del antiguo Egipto
      pt: Arte de Book of Dead com um explorador e um livro misterioso num cenário do antigo Egito
      ja: 古代エジプトを背景に探検家と神秘的な本を描いたBook of Deadのゲームアート
