  en: Explore the game collection
  pl: Poznaj wybrane gry
  es: Explora la selección de juegos
  pt: Explore a seleção de jogos
  ja: ゲームコレクションを見る
section_description:
  de: Entdecke die Themen und Spielmechaniken der fünf vorgestellten Slots. Jedes Profil führt direkt zu den ausführlichen Informationen weiter unten.
  en: Browse the themes and mechanics of five featured slots. Each card takes you straight to its detailed guide below.
  pl: Poznaj motywy i mechanikę pięciu wybranych automatów. Każda karta prowadzi bezpośrednio do szczegółowego profilu poniżej.
  es: Descubre los temas y las mecánicas de cinco tragaperras seleccionadas. Cada tarjeta enlaza con su guía detallada.
  pt: Conheça os temas e as mecânicas de cinco slots selecionados. Cada cartão leva diretamente ao respetivo guia detalhado.
  ja: 5つのスロットのテーマとゲームの仕組みを紹介します。各カードから下部の詳しいガイドへ移動できます。
read_more:
  de: Spielprofil ansehen
  en: Read game guide
  pl: Zobacz profil gry
