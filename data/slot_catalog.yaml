games:
  - name: Bigger Bass Bonanza
    anchor: bigger-bass-bonanza
    image: /images/slots/bigger-bass-bonanza-cover.webp
    label:
      de: Angeln · Freispiele
      en: Fishing · Free spins
      pl: Wędkarstwo · Darmowe spiny
      es: Pesca · Giros gratis
      pt: Pesca · Rodadas grátis
      ja: 釣りテーマ · フリースピン
    description:
      de: Ein Angelthema mit Fischsymbolen, einer Freispielrunde und einer Bonusmechanik mit Multiplikatoren.
      en: A fishing theme with fish symbols, a free-spins round and a bonus feature with multipliers.
      pl: Motyw wędkarski, symbole ryb, runda darmowych spinów i funkcja bonusowa z mnożnikami.
      es: Una temática de pesca con símbolos de peces, una ronda de giros gratis y una función de bonificación con multiplicadores.
      pt: Um tema de pesca com símbolos de peixes, uma ronda de rodadas grátis e uma funcionalidade de bónus com multiplicadores.
      ja: 魚のシンボル、フリースピン、倍率機能を備えた釣りテーマのスロットです。
    alt:
      de: Bigger Bass Bonanza Spielgrafik mit Angler, goldenem Fisch und tropischem Hintergrund
      en: Bigger Bass Bonanza game artwork showing a fisherman, a golden fish and a tropical background
      pl: Grafika gry Bigger Bass Bonanza przedstawiająca wędkarza, złotą rybę i tropikalne tło
      es: Arte de Bigger Bass Bonanza con un pescador, un pez dorado y un fondo tropical
      pt: Arte de Bigger Bass Bonanza com um pescador, um peixe dourado e um cenário tropical
      ja: 釣り人と金色の魚、南国の背景を描いたBigger Bass Bonanzaのゲームアート
  - name: Bonanza
    anchor: bonanza
    image: /images/slots/bonanza-cover.webp
    label:
      de: Megaways · Kaskaden
      en: Megaways · Cascades
      pl: Megaways · Kaskady
      es: Megaways · Cascadas
      pt: Megaways · Cascatas
      ja: Megaways · カスケード
    description:
      de: Ein Goldgräbermotiv mit wechselnder Walzenstruktur und kaskadierenden Symbolen.
      en: A gold-mining theme with changing reel layouts and cascading symbols.
      pl: Motyw poszukiwania złota ze zmiennym układem bębnów i kaskadowymi symbolami.
      es: Una temática minera con configuraciones variables de carretes y símbolos en cascada.
      pt: Um tema de exploração mineira com configurações variáveis dos rolos e símbolos em cascata.
      ja: 金鉱をテーマに、リール構成が変化し、シンボルが連続して落下するスロットです。
    alt:
      de: Bonanza Spielgrafik mit rotem Edelstein und goldener Schrift auf einem hölzernen Schild
      en: Bonanza game artwork with a red gemstone and gold lettering on a wooden sign
      pl: Grafika Bonanza z czerwonym klejnotem i złotym napisem na drewnianej tablicy
      es: Arte de Bonanza con una gema roja y letras doradas sobre un letrero de madera
      pt: Arte de Bonanza com uma gema vermelha e letras douradas numa placa de madeira
      ja: 赤い宝石と木製の看板に描かれた金色の文字が特徴のBonanzaゲームアート
