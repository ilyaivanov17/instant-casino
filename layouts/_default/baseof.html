<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}" dir="ltr">
<head>
  {{ partial "head.html" . }}
</head>
<body class="bg-slate-950 text-white font-sans antialiased">
  <a class="skip-link" href="#main-content">Skip to main content</a>
  {{ partial "header.html" . }}
  <main id="main-content">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  {{ partial "cookie-banner.html" . }}
  {{ partial "scripts.html" . }}
</body>
</html>
