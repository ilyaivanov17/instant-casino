{{ define "main" }}
<section class="casino-section py-12">
  <div class="container mx-auto px-4">
    <h1 class="text-3xl font-bold mb-6">{{ .Title }}</h1>
    {{ with .Content }}<div class="prose prose-invert max-w-none mb-8">{{ . }}</div>{{ end }}
    {{ $pages := .RegularPages.ByWeight }}
    {{ if $pages }}
      <ul class="space-y-4">
        {{ range $pages }}
          <li><a class="underline" href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></li>
        {{ end }}
      </ul>
    {{ end }}
  </div>
</section>
{{ end }}
