{{ if and (not .IsHome) (ne .Type "author") }}
{{ $settings := (site.GetPage "/editorial/settings").Params }}
<div class="editorial-meta flex flex-wrap items-center gap-x-4 gap-y-2 text-sm text-slate-500 mb-8" aria-label="{{ partial "t.html" "editorial_metadata" }}">
  <span>{{ partial "t.html" "editorial_by" }}: <strong class="text-slate-300">{{ $settings.author }}</strong></span>
  {{ with .Lastmod }}<span>{{ partial "t.html" "last_updated" }}: <time datetime="{{ .Format "2006-01-02" }}">{{ .Format "02.01.2006" }}</time></span>{{ end }}
</div>
{{ end }}
