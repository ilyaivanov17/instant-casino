{{ $settings := (site.GetPage "/editorial/settings").Params }}
<header class="lobby-header">
  <div class="lobby-header-inner container mx-auto px-4">
    <a href="{{ .Site.Home.RelPermalink }}" class="lobby-logo" aria-label="{{ $settings.brand }}">
      <span class="lobby-logo-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none"><path d="M4 9 10 14 16 4 22 14 28 9 25 24H7L4 9Z" fill="currentColor" stroke="#fff0a6" stroke-width="1"/><path d="M8 27H24" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="15" r="2" fill="#3b0b63"/></svg>
      </span>
      <span class="lobby-logo-type">Instant Casino</span>
    </a>

    <nav class="lobby-nav hidden md:flex" aria-label="{{ partial "t.html" "aria_primary_navigation" }}">
      {{ range $settings.menu }}
      <a href="{{ .pageRef | relLangURL }}" class="lobby-nav-link{{ if eq $.RelPermalink (.pageRef | relLangURL) }} is-active{{ end }}">
        <span class="nav-dot" aria-hidden="true"></span>{{ .name }}
      </a>
      {{ end }}
    </nav>

    <div class="lobby-actions">
      <div class="language-switcher">
        <label class="sr-only" for="language-select">{{ partial "t.html" "language" }}</label>
        <select id="language-select" class="language-select lobby-language" onchange="if(this.value) window.location.href=this.value">
          {{ $page := . }}
          {{ range site.Sites }}
            {{ $languageSite := . }}
            {{ $targetURL := $languageSite.Home.RelPermalink }}
            {{ range $page.AllTranslations }}{{ if eq .Language.Lang $languageSite.Language.Lang }}{{ $targetURL = .RelPermalink }}{{ end }}{{ end }}
            <option value="{{ $targetURL }}"{{ if eq $languageSite.Language.Lang $page.Language.Lang }} selected{{ end }}>{{ $languageSite.Language.Lang | upper }}</option>
          {{ end }}
        </select>
      </div>
      <a href="{{ $settings.affiliate_link }}" target="_blank" rel="nofollow sponsored noopener" class="lobby-ghost-cta">{{ partial "t.html" "sign_in" }}</a>
      <a href="{{ $settings.affiliate_link }}" target="_blank" rel="nofollow sponsored noopener" class="lobby-gold-cta">{{ $settings.affiliate_cta }}</a>
      <button id="mobile-menu-btn" class="lobby-menu-btn md:hidden" aria-label="{{ partial "t.html" "menu" }}" aria-expanded="false" aria-controls="mobile-menu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </div>

  <nav id="mobile-menu" class="md:hidden hidden lobby-mobile-menu" aria-label="{{ partial "t.html" "aria_primary_navigation" }}">
    <div class="container mx-auto px-4 py-3">
      {{ range $settings.menu }}<a href="{{ .pageRef | relLangURL }}">{{ .name }}</a>{{ end }}
      <div class="mobile-language-row">
        <label for="mobile-language-select">{{ partial "t.html" "language" }}</label>
        <select id="mobile-language-select" class="language-select lobby-language" onchange="if(this.value) window.location.href=this.value">
          {{ $page := . }}
          {{ range site.Sites }}
            {{ $languageSite := . }}
            {{ $targetURL := $languageSite.Home.RelPermalink }}
            {{ range $page.AllTranslations }}{{ if eq .Language.Lang $languageSite.Language.Lang }}{{ $targetURL = .RelPermalink }}{{ end }}{{ end }}
            <option value="{{ $targetURL }}"{{ if eq $languageSite.Language.Lang $page.Language.Lang }} selected{{ end }}>{{ $languageSite.Language.Lang | upper }}</option>
          {{ end }}
        </select>
      </div>
      <a href="{{ $settings.affiliate_link }}" target="_blank" rel="nofollow sponsored noopener" class="lobby-gold-cta mobile-cta">{{ $settings.affiliate_cta }}</a>
    </div>
  </nav>
</header>
